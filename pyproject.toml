[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "faster-or-curvature"
dynamic = ["version"]  # read from orcut.__version__, the only place to bump it
description = "Exact Ollivier-Ricci curvature for graphs, computed with one minimum cut per edge"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giorgio Micaletto" }]
requires-python = ">=3.10"
dependencies = ["numba>=0.62", "numpy>=2.2"]
keywords = ["ollivier-ricci", "curvature", "graphs", "optimal transport", "minimum cut"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["pytest", "networkx>=3.3", "scipy"]

[project.urls]
Repository = "https://github.com/GiorgioMB/faster-or-curvature"
Changelog = "https://github.com/GiorgioMB/faster-or-curvature/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["orcut"]

[tool.setuptools.dynamic]
version = { attr = "orcut.__version__" }
