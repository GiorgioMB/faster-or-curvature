# Builds the wheels (native backend, abi3: one per platform for every Python >= 3.10) and the sdist
# on every push to main and every pull request, and tests the installed wheels outside the
# checkout. A pushed tag vX.Y.Z also publishes faster-or-curvature X.Y.Z to PyPI (trusted
# publishing: no tokens), once everything has passed.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: The tag must match the version (Cargo.toml and orcut/__init__.py)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test -f "dist/faster_or_curvature-${GITHUB_REF_NAME#v}.tar.gz" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml:"; ls dist; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/

  test:
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: ubuntu-24.04-arm, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/
      - name: Install the wheel for this platform (and the test dependencies)
        shell: bash
        run: |
          python -m pip install "numba>=0.62" "numpy>=2.2" pytest "networkx>=3.3" scipy
          python -m pip install --no-index --no-deps --find-links dist faster-or-curvature
      - name: Test the installed wheel (outside the checkout, so the source tree is not imported)
        shell: bash
        run: |
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -c "import orcut; assert orcut.native_available(); print(orcut.__version__)"
          python -m pytest -q tests

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/faster-or-curvature/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
