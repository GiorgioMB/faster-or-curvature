# Tests on every push to main and every pull request. A pushed tag vX.Y.Z also publishes
# faster-or-curvature X.Y.Z to PyPI (trusted publishing: no tokens), once the tests have passed.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: The tag must match orcut.__version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test -f "dist/faster_or_curvature-${GITHUB_REF_NAME#v}-py3-none-any.whl" || {
            echo "tag $GITHUB_REF_NAME does not match orcut/__init__.py:"; ls dist; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: python -m pip install "$(echo dist/*.whl)[dev]"
      - name: Test the installed wheel (outside the checkout, so the source tree is not imported)
        run: |
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -m pytest -q tests

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/faster-or-curvature/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
