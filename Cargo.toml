[package]
name = "orcut-native"
version = "1.3.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Native kernels of faster-or-curvature (imported as orcut._native)"
repository = "https://github.com/GiorgioMB/faster-or-curvature"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
numpy = "0.30"
rayon = "1.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
